name: Plugin SDK conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.19.2
      - run: python -m unittest discover -s tests
